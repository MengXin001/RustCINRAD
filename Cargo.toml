[workspace]
members = ["crates/rustcinrad", "crates/rustcinrad-app", "crates/rustcinrad-cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
anyhow = "1.0.104"
binrw = "0.15.2"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.8", default-features = false, features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage"] }
encoding_rs = "0.8.44"
flate2 = "1.1.11"
font-kit = { version = "0.14.3", default-features = false }
geographiclib-rs = "0.2.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
ndarray = { version = "0.17.2", features = ["rayon"] }
pathfinder_geometry = "0.5.1"
plotters = { version = "0.3.7", default-features = false, features = ["ab_glyph", "bitmap_backend", "line_series"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
rustcinrad = { path = "crates/rustcinrad", version = "0.3.0" }
rustcinrad-app = { path = "crates/rustcinrad-app", version = "0.3.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
temp-dir = "0.2.0"
thiserror = "2.0.21"
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std", "tracing-log"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
